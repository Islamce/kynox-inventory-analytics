name: Security

# Baseline security gate:
#   1. gitleaks over the full git history (this repository is PUBLIC, so any
#      committed secret is already exposed — the gate keeps new ones out).
#   2. npm audit of production dependencies at high severity.
#   3. CodeQL static analysis (free for public repositories).

on:
  pull_request:
  push:
    branches: [hostinger-uat, main]
  schedule:
    - cron: "23 3 * * 0" # weekly, Sunday 06:23 Asia/Riyadh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan
        # CI-only fixture values in ci.yml are allow-listed in .gitleaksignore.
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit (lockfile only, production deps, high+)
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
